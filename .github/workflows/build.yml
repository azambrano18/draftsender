name: Build DraftSender EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller and required libraries
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pandas openpyxl pywin32 psutil mammoth python-docx pytz psycopg2 requests Pillow dnspython pywinauto

      - name: Escribir version.txt con run_number
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path draftsender_app/data
          "${{ github.run_number }}" | Out-File -Encoding utf8 draftsender_app/data/version.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
          --name DraftSender `
          --icon draftsender_app/config/icon.ico `
          --add-data "draftsender_app/config/cover.jpg;config" `
          --paths . `
          --hidden-import=requests `
          --hidden-import=psutil `
          --hidden-import=PIL `
          --hidden-import=dns `
          --hidden-import=pywinauto `
          draftsender_app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftSender
          path: dist/DraftSender.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: DraftSender Release ${{ github.run_number }}
          body: "Release automático generado desde push a main."
          files: dist/DraftSender.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}