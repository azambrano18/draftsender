name: Build & Release DraftSender

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Escribir version.txt con tag actual
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path draftsender_app/data
          "${{ github.ref_name }}" | Out-File -Encoding utf8 draftsender_app/data/version.txt
          Get-Content draftsender_app/data/version.txt

      - name: Compilar con PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed `
            --name "DraftSender_${{ github.ref_name }}" `
            --icon draftsender_app/config/icon.ico `
            --add-data "draftsender_app/config/cover.jpg;config" `
            --add-data "draftsender_app/data/version.txt;data" `
            --paths . `
            --hidden-import=requests `
            --hidden-import=psutil `
            --hidden-import=PIL `
            --hidden-import=dns `
            --hidden-import=pywinauto `
            --hidden-import=dotenv `
            draftsender_app/main.py

      - name: Verificar ejecutable generado
        shell: pwsh
        run: |
          $exe = "dist/DraftSender_${{ github.ref_name }}.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó el ejecutable esperado: $exe"
          }
          Get-Item $exe

      - name: Crear GitHub Release y subir ejecutable
        uses: softprops/action-gh-release@v2
        with:
          name: DraftSender ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/DraftSender_${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}