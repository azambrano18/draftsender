name: Build & Release DraftSender

on:
  push:
    tags:
      - 'v*'  # Ejecuta solo con git tag v1.0.0, etc.

permissions:
  contents: write  # necesario para crear releases y subir assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller and required libraries
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pandas openpyxl pywin32 psutil mammoth python-docx pytz psycopg2 requests Pillow dnspython pywinauto

      - name: Escribir version.txt con tag actual
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path draftsender_app/data
          "${{ github.ref_name }}" | Out-File -Encoding utf8 draftsender_app/data/version.txt

      - name: Compilar con PyInstaller (nombre versionado y assets correctos)
        run: |
          pyinstaller --noconfirm --onefile --windowed `
          --name "DraftSender_${{ github.ref_name }}" `
          --icon draftsender_app/config/icon.ico `
          --add-data "draftsender_app/config/cover.jpg;config" `
          --add-data "draftsender_app/data/version.txt;data" `
          --paths . `
          --hidden-import=requests `
          --hidden-import=psutil `
          --hidden-import=PIL `
          --hidden-import=dns `
          --hidden-import=pywinauto `
          draftsender_app/main.py

      - name: Crear GitHub Release y subir ejecutable
        uses: softprops/action-gh-release@v1
        with:
          name: DraftSender ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/DraftSender_v${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}