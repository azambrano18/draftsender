name: Build EXE on Tag Push

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: Build executable with PyInstaller
        run: |
          pyinstaller main.py --name "DraftSender v${{ github.ref_name }}" --onefile --noconfirm --add-data "config;config" --add-data "data;data"

      - name: Upload executable to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
         files: "dist/DraftSender v${{ github.ref_name }}.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
